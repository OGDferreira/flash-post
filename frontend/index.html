<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <meta name="apple-mobile-web-app-title" content="Flash" />
    <meta name="color-scheme" content="dark light" />
    <script>try{if(localStorage.getItem("flashpost-motion")==="off")document.documentElement.dataset.motion="off";var t=localStorage.getItem("flashpost-theme");if(!t){var c=document.cookie.match(/(?:^|; )flashpost-theme=(light|dark)/);t=c&&c[1]}if(t==="light"){document.documentElement.dataset.theme="light";var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content","#f5f6f9")}var p=location.pathname;var bot=/^\/(bot|carteira|feature\/affiliates|feature\/bots)(\/|$)/.test(p);document.documentElement.dataset.app=bot?"bot":"post";if(bot)document.title="Flash"}catch(e){}</script>
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.png?v=4" type="image/png" />
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <meta
      name="description"
      content="Flash — publicação no Instagram, funis de venda no Telegram e resultados em um só lugar."
    />
    <title>Flash</title>
    <style>
      html{background:#050507}html[data-theme="light"]{background:#f5f6f9}
      .boot{position:fixed;inset:0;display:grid;place-items:center;--rgb:30 156 253}
      html[data-app="bot"] .boot{--rgb:30 156 253}
      .boot .em{position:relative;width:96px;height:96px;display:block;filter:drop-shadow(0 0 22px rgb(var(--rgb)/.5))}
      .boot .em img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:f-in 820ms cubic-bezier(.2,.9,.25,1.15) both,f-br 2.8s ease-in-out 1.2s infinite}
      .boot .em img.b{display:none}html[data-app="bot"] .boot .em img.b{display:block}html[data-app="bot"] .boot .em img.p{display:none}
      .boot .em:before{content:"";position:absolute;inset:-18%;border-radius:50%;border:2px solid rgb(var(--rgb)/.6);animation:f-ring 1.1s 120ms cubic-bezier(.2,.8,.2,1) both}
      .boot .glow{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgb(var(--rgb)/.32),transparent 70%);animation:f-glow 1.4s 200ms ease-out both}
      @keyframes f-in{0%{opacity:0;transform:scale(.55) rotate(-24deg);filter:blur(6px)}60%{opacity:1;transform:scale(1.06) rotate(3deg);filter:blur(0)}100%{opacity:1;transform:none}}
      @keyframes f-ring{0%{opacity:0;transform:scale(.4) rotate(-90deg)}50%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
      @keyframes f-br{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
      @keyframes f-glow{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
      @media (prefers-reduced-motion:reduce){.boot *,.boot .em:before{animation:none!important}}
      html[data-motion="off"] .boot *,html[data-motion="off"] .boot .em:before{animation:none!important}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Carregando"><span class="glow"></span><span class="em"><img class="p" src="/brand/flash-emblem.svg" alt="" /><img class="b" src="/brand/flash-emblem.svg" alt="" /></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
